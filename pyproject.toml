[project]
name = "radiant-subnet"
version = "0.0.1"
description = "RADiant: a campaign-based Bittensor subnet for chest X-ray classifiers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The installable part is the miner SDK (radiant_sdk). The validator code in
# this repo runs from source in the Docker image.
dependencies = ["numpy>=1.26"]

[project.scripts]
radiant-sdk = "radiant_sdk.cli:main"

[project.optional-dependencies]
# What `radiant-sdk validate` needs on a miner's machine.
sdk = [
    "safetensors>=0.4",
    "requests>=2.32",
    "huggingface_hub>=0.26",
    "modal>=1.4",
]
# Validator services (api, seed, migrations). The Docker image installs this.
validator = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "boto3>=1.35",
]
# R0 feasibility probes. Each probe imports only what it needs, so a missing
# extra blocks that one gate instead of the whole run.
r0 = [
    "boto3>=1.35",
    "requests>=2.32",
    "modal>=1.4",
    "huggingface_hub>=0.26",
    "numpy>=1.26",
    "pillow>=10.4",
]
r0-models = [
    "torch>=2.4",
    "torchvision>=0.19",
    "torchxrayvision>=1.5",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
]
dev = ["pytest>=8.3", "moto[server]>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radiant_sdk*"]

[tool.setuptools.package-data]
radiant_sdk = [
    "base_image/requirements.in",
    "base_image/requirements.txt",
    "reference_miner/*.py",
    "reference_miner/*.json",
    "reference_miner/*.md",
    "reference_miner/requirements.in",
    "reference_miner/requirements.lock",
    "reference_miner/.env.template",
    "reference_miner/miner.env.template",
]
